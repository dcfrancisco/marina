name: CI (Backlog)

on:
  workflow_dispatch:

# Automatic CI is intentionally disabled. The workflow remains available for
# an explicit manual run while CI is tracked as backlog work.

jobs:
  test-and-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Cache Cargo dependencies and build artifacts
        uses: Swatinem/rust-cache@v2
      - name: Run all tests
        run: cargo test --all-targets
      - name: Run non-interactive examples
        run: ./scripts/run_examples_noninteractive.sh
